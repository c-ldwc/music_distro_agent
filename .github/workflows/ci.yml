name: Python package

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Test with pytest
        run: |
          uv run pytest --junitxml=junit/test-results.xml --cov=src --cov-report=xml --cov-report=term-missing
